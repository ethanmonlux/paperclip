# yaml-language-server: $schema=./catalog.schema.json
# Planning scenarios; not registered executions or evidence of a pass.
schema_version: 1
feature: item-artwork
status: planned
scenarios:
  - id: item-artwork.open
    capabilities:
      - item-artwork/navigation
    context: >-
      The member has company access and a published item explorer snapshot is available.
    query: >-
      Open Item artwork directly on my phone.
    expected_outcome: >-
      The member uses the persistent phone navigation control to open the company-scoped explorer
      in one tap. Reload preserves the route without entering task chat.
  - id: item-artwork.latest-snapshot
    capabilities:
      - item-artwork/snapshot
    context: >-
      STA-290 has a stable work product whose latest authorized HTML attachment was replaced.
    query: >-
      Show the current item explorer snapshot.
    expected_outcome: >-
      The route resolves the stable work product to the latest attachment and opens the capped,
      sandboxed HTML preview. Missing, failed and unauthorized artifacts show truthful states.
  - id: item-artwork.return
    capabilities:
      - item-artwork/return
    context: >-
      The member opened Item artwork from a company view, or entered directly with no safe history.
    query: >-
      Go back from the item explorer, or take me home to Console.
    expected_outcome: >-
      Back returns to a recorded same-company app view when one exists and otherwise opens the
      company Console. Home always opens Console, including while the explorer loads or fails.
