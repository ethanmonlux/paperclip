# yaml-language-server: $schema=./catalog.schema.json
# Planning scenarios; not registered executions or evidence of a pass.
schema_version: 1
feature: system-atlas
status: planned
scenarios:
  - id: system-atlas.explore
    capabilities:
      - system-atlas/exploration
    context: >-
      The member has access to the current company and wants to understand how its work reaches delivery.
    query: >-
      Show me the path from an approved task through review and installation in the System Atlas.
    expected_outcome: >-
      The member opens the authenticated company Atlas, follows its chapter and walkthrough links,
      and can read progressive summary, inner workings and evidence on a phone. The response
      distinguishes source integration from installed and observed behavior.
  - id: system-atlas.source-drift
    capabilities:
      - system-atlas/freshness
    context: >-
      Relevant repository source changed after an Atlas explanation was authored, and the current
      member has an authorized GitHub source grant.
    query: >-
      Is the Atlas explanation current after the latest source change?
    expected_outcome: >-
      The Atlas shows source revision, installed revision and observation time separately, labels
      affected explanations stale, and links the deduplicated native owner refresh task when routed.
      A failed comparison says unknown and retains last-good evidence without calling it current.
